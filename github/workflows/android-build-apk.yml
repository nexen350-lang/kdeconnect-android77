name: Build KDE Connect APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # يتيح لك الضغط على زر تشغيل البناء يدوياً في أي وقت

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          ./gradlew assembleFdroidDebug assembleDebug \
            -x test \
            -x lint \
            -x lintVitalAnalyzeRelease \
            -x lintVitalRelease \
            --no-daemon \
            --stacktrace || ./gradlew assembleDebug -x test -x lint --no-daemon

      - name: Find and List Generated APKs
        run: |
          echo "=== Generated APK Files ==="
          find . -name "*.apk" -type f

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kdeconnect-apk
          path: |
            **/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error
