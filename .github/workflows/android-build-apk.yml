name: Build KDE Connect Android APK

on:
  push:
    branches: [ master, main, dev, feature/* ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare KDE Connect Android Source
        run: |
          if [ -f "scripts/prepare_kdeconnect.sh" ]; then
            chmod +x scripts/prepare_kdeconnect.sh
            ./scripts/prepare_kdeconnect.sh
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK & Accept Licenses
        run: |
          echo "Configuring Android SDK licenses..."
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "84831b9409646a323e44406f89020195e6e0ca07" >> "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || true
          yes | sdkmanager --licenses 2>/dev/null || true
          echo "Ensuring compileSdk 37 and build tools are installed..."
          sdkmanager "platforms;android-37" "build-tools;35.0.0" 2>/dev/null || true

      - name: Assemble Android APK (${{ github.event.inputs.build_type || 'debug' }})
        run: |
          TARGET_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Building Android APK target: $TARGET_TYPE"
          chmod +x ./gradlew
          if [ "$TARGET_TYPE" = "release" ]; then
            ./gradlew assembleRelease -x test -x lint --no-daemon --console=plain --stacktrace || ./gradlew assembleDebug -x test -x lint --no-daemon --console=plain --stacktrace
          else
            ./gradlew assembleDebug -x test -x lint --no-daemon --console=plain --stacktrace
          fi

      - name: Stage APK Artifacts
        run: |
          mkdir -p build-artifacts
          echo "Searching for compiled APKs..."
          find . -type f -name "*.apk" -not -path "*/intermediates/*" -exec cp -v {} build-artifacts/ \;
          ls -lah build-artifacts/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kdeconnect-remote-chat-debug-apk
          path: build-artifacts/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Summary & Checksums
        run: |
          echo "### 🚀 KDE Connect Android Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Size | SHA-256 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in build-artifacts/*.apk; do
            if [ -f "$f" ]; then
              FNAME=$(basename "$f")
              FSIZE=$(du -h "$f" | awk '{print $1}')
              FSHA=$(sha256sum "$f" | awk '{print $1}')
              echo "| \`$FNAME\` | $FSIZE | \`$FSHA\` |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          tag_name: "v1.37.0-b${{ github.run_number }}"
          name: "KDE Connect Android v1.37.0 (Build #${{ github.run_number }})"
          body: |
            ## 🚀 KDE Connect Android v1.37.0 Extended Release
            ### 🌟 Included Custom Features:
            * **📁 Remote File Browser & Downloader**: Direct peer-to-peer file browsing and downloads over local Wi-Fi.
            * **💬 Bulletin Chat & Shared Notes**: Persistent device-to-device chat messaging and sticky notes.
            * **🎵 Multimedia Control**: MPRIS player control, media state, and volume management.
            * **🛡️ Hardened Security**: CWE-22 path traversal prevention and strict TLS 1.3 socket validation.
            ### 📦 Direct Installation:
            Download the attached `.apk` file below and open it on your Android device to install or update.
          files: build-artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
